<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Remote 管理</title>
<!--
  场景开关（通过 URL hash 进入，页面上不可见）：
    #s=all-good          总览"一切正常"空态
    #s=plan-blocked      选中机器人自动配置受阻
    #s=plan-degraded     选中机器人自动配置降级
    #s=plan-review       发布后等待管理员审核
    #s=runtime-pending   机器人同步中（禁用自动配置按钮）
    #s=perm-missing      权限检查发现缺失权限（含复制导入 JSON）
    #s=perm-error        权限检查首次失败（toast + 卡片内重试）
    #s=readonly-bot      运行环境提供的机器人（不可删除）
    #s=qr-expired        添加机器人扫码过期
    #s=add-fail          手动添加首次验证失败
    #s=conflict          保存配置首次提示被其他窗口修改
    #s=refs              删除 Codex 配置时列出使用中引用
    #s=storage-partial   预览文件清理部分失败
    #s=load-error        整页加载失败态（重新加载恢复）
    无 hash              默认数据（含若干待处理项）
-->
<style>
:root {
  --ink: #112B39;
  --ink-deep: #0A1824;
  --cream: #F7EBD7;
  --teal: #0F9588;
  --teal-bright: #20CBB8;
  --teal-hover: #0C8075;
  --amber: #FFB56F;
  --danger: #C2443B;
  --bg-page: #F5F2EA;
  --bg-card: #FFFFFF;
  --bg-hover: #F3EFE4;
  --text-primary: #16242C;
  --text-secondary: #4A5B64;
  --text-muted: #7C8A91;
  --text-on-dark: #E7D5B6;
  --text-on-dark-muted: #9FB3BC;
  --border: #E3DCCB;
  --border-strong: #CFC6B0;
  --good-bg: #E4F5F1; --good-border: #A5DED3; --good-text: #0C6E64;
  --warn-bg: #FDF0DC; --warn-border: #EFCB92; --warn-text: #8A5A1D;
  --danger-bg: #FAE8E6; --danger-border: #E5AAA3; --danger-text: #96231B;
  --shadow-card: 0 1px 2px rgba(10,24,36,.06);
  --shadow-modal: 0 8px 24px rgba(10,24,36,.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-page); color: var(--text-primary);
  font-size: 14px; line-height: 1.6; min-height: 100vh;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* ---------- 侧边导航（桌面） ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 232px;
  background: var(--ink-deep); padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand img { width: 32px; height: 32px; }
.brand .brand-name { font-size: 16px; font-weight: 600; color: var(--text-on-dark); line-height: 1.4; }
.brand .brand-sub { font-size: 12px; color: var(--text-on-dark-muted); line-height: 1.4; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.side-nav button {
  height: 40px; border: none; border-radius: 8px; background: none;
  text-align: left; padding: 0 12px; font-size: 14px; font-weight: 500;
  color: var(--text-on-dark-muted); transition: background .15s ease-out, color .15s ease-out;
}
.side-nav button:hover { color: var(--text-on-dark); }
.side-nav button.on { background: rgba(32,203,184,.14); color: var(--teal-bright); }

/* ---------- 移动端顶部品牌条 + 底部 tab ---------- */
.mobile-brand {
  display: none; align-items: center; gap: 12px;
  background: var(--ink-deep); padding: 12px 16px; position: sticky; top: 0; z-index: 20;
}
.mobile-brand img { width: 24px; height: 24px; }
.mobile-brand .brand-name { font-size: 14px; font-weight: 600; color: var(--text-on-dark); }
.bottom-tabs {
  display: none; position: fixed; inset: auto 0 0 0; height: 56px;
  background: var(--bg-card); border-top: 1px solid var(--border); z-index: 20;
}
.bottom-tabs button {
  flex: 1; border: none; background: none; font-size: 12px; color: var(--text-muted);
  border-top: 2px solid transparent; font-weight: 500;
}
.bottom-tabs button.on { color: var(--teal); border-top-color: var(--teal); }

/* ---------- 内容区 ---------- */
.content { max-width: 980px; margin: 0 0 0 232px; padding: 28px; }
.area-title { font-size: 24px; line-height: 1.3; font-weight: 600; color: var(--ink); }
.area-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; margin-bottom: 16px; }

/* ---------- 卡片 / 统计 ---------- */
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-card); padding: 24px; margin-bottom: 16px;
}
.card h3 { font-size: 16px; line-height: 1.4; font-weight: 600; color: var(--ink); }
.card .card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-card); padding: 16px 24px;
}
.stat-card .label { font-size: 12px; color: var(--text-muted); }
.stat-card .value { font-size: 28px; line-height: 1.2; font-weight: 600; color: var(--ink); margin-top: 4px; }
.stat-card .detail { font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- 状态点 / 徽标 ---------- */
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex: none; }
.dot.good { background: var(--teal); }
.dot.warn { background: var(--amber); }
.dot.danger { background: var(--danger); }
.dot.idle { background: var(--border-strong); }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.badge {
  font-size: 12px; line-height: 1.4; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.badge.good { background: var(--good-bg); color: var(--good-text); }
.badge.warn { background: var(--warn-bg); color: var(--warn-text); }
.badge.danger { background: var(--danger-bg); color: var(--danger-text); }
.badge.neutral { background: var(--bg-hover); color: var(--text-secondary); }

/* ---------- notice / toast ---------- */
.notice { border-radius: 10px; border: 1px solid; padding: 12px 16px; font-size: 14px; margin-top: 12px; }
.notice strong { font-weight: 500; display: block; }
.notice .sub { font-size: 13px; margin-top: 4px; }
.notice.good { background: var(--good-bg); border-color: var(--good-border); color: var(--good-text); }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
.notice.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
.toast {
  border-radius: 10px; border: 1px solid; padding: 12px 16px; font-size: 14px;
  margin-bottom: 16px; box-shadow: var(--shadow-modal);
}
.toast.good { background: var(--good-bg); border-color: var(--good-border); color: var(--good-text); }
.toast.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
.toast.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }

/* ---------- 按钮 ---------- */
.btn {
  height: 36px; padding: 0 16px; border-radius: 6px; font-size: 14px; font-weight: 500;
  border: 1px solid transparent; transition: background .15s ease-out, opacity .15s ease-out;
}
.btn:disabled { opacity: .5; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--teal-hover); }
.btn-secondary { background: var(--bg-card); border-color: var(--border); color: var(--text-primary); }
.btn-secondary:hover:not(:disabled) { border-color: var(--border-strong); background: var(--bg-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #A93A32; }
.btn-ghost { background: none; border: none; color: var(--teal); padding: 0 8px; height: auto; }
.btn-ghost:hover:not(:disabled) { text-decoration: underline; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; align-items: center; }

/* ---------- 分栏（列表 + 详情） ---------- */
.split { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.list-pane { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-card); overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 44px; padding: 12px 16px; border: none; background: none;
  text-align: left; border-left: 3px solid transparent; border-bottom: 1px solid var(--border);
  transition: background .15s ease-out;
}
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--bg-hover); }
.list-row.on { border-left-color: var(--teal); background: var(--bg-hover); }
.list-row .row-main { flex: 1; min-width: 0; }
.list-row .row-title { font-size: 14px; font-weight: 500; color: var(--ink); }
.list-row .row-sub { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-link { display: none; margin-bottom: 12px; }

/* ---------- 定义列表 / 需求清单 ---------- */
.def-list { margin-top: 12px; }
.def-list .def-row { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
.def-list dt { width: 96px; flex: none; color: var(--text-muted); font-size: 13px; }
.def-list dd { color: var(--text-primary); word-break: break-all; }
.def-list .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.req-group { margin-top: 16px; }
.req-group-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
.req-group-title.danger { color: var(--danger-text); }
.req-group-title.warn { color: var(--warn-text); }
.req-item { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.req-item .dot { margin-top: 7px; }
.req-item .label { font-size: 14px; font-weight: 500; }
.req-item .detail { font-size: 13px; color: var(--text-secondary); }

/* ---------- 表单 ---------- */
.field { margin-top: 16px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.field input, .field select {
  width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 6px;
  padding: 0 12px; font: inherit; font-size: 14px; color: var(--text-primary); background: #fff;
  transition: border-color .15s ease-out, box-shadow .15s ease-out;
}
.field input:hover, .field select:hover { border-color: var(--border-strong); }
.field input:focus, .field select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(15,149,136,.25); outline: none; }
.field input:disabled, .field select:disabled { background: var(--bg-hover); color: var(--text-muted); }
.field input.invalid { border-color: var(--danger); }
.field .err { font-size: 12px; color: var(--danger); margin-top: 4px; }
.field .hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.check-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--teal); }
.hero-card {
  margin-top: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-page); padding: 16px; font-size: 14px; color: var(--text-secondary);
}
.hero-card strong { color: var(--ink); font-weight: 500; display: block; margin-bottom: 4px; }

/* ---------- tab（对话后端） ---------- */
.tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-bar button {
  border: none; background: none; padding: 8px 16px; font-size: 14px; font-weight: 500;
  color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab-bar button.on { color: var(--teal); border-bottom-color: var(--teal); }

/* ---------- 二维码 ---------- */
.qr-box {
  width: 200px; height: 200px; margin: 16px auto 0; border: 1px solid var(--border);
  border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 13px;
}
.qr-hint { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 12px; }
.seg-control { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 16px; }
.seg-control button { flex: 1; height: 36px; border: none; background: var(--bg-card); font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.seg-control button.on { background: var(--teal); color: #fff; }

/* ---------- 对话框 ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10,24,36,.45);
  display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
}
.modal-card {
  background: var(--bg-card); border-radius: 14px; box-shadow: var(--shadow-modal);
  max-width: 420px; width: 100%; padding: 24px; animation: modal-in .15s ease-out;
}
@keyframes modal-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }
.modal-card h3 { font-size: 16px; font-weight: 600; color: var(--ink); }
.modal-card p { font-size: 14px; margin-top: 12px; }
.modal-card .ref-list { margin-top: 12px; border-top: 1px solid var(--border); }
.modal-card .ref-list li {
  list-style: none; padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 13px; display: flex; gap: 8px; align-items: center;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

/* ---------- 加载 / 空态 ---------- */
.spinner {
  width: 16px; height: 16px; border-radius: 999px; flex: none;
  border: 2px solid var(--good-border); border-top-color: var(--teal);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-top: 12px; }
.empty-state { text-align: center; padding: 32px 16px; font-size: 14px; color: var(--text-secondary); }

@media (max-width: 767px) {
  .sidebar { display: none; }
  .mobile-brand { display: flex; }
  .bottom-tabs { display: flex; }
  .content { margin: 0; padding: 16px 16px 80px; }
  .card { padding: 16px; }
  .stat-row { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
  .split .detail-pane { display: none; }
  .split.show-detail .detail-pane { display: block; }
  .split.show-detail .list-pane { display: none; }
  .back-link { display: inline-block; }
  .btn { height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="../../assets/branding/codex-remote-logo.svg" alt="">
    <div>
      <div class="brand-name">Codex Remote</div>
      <div class="brand-sub">管理</div>
    </div>
  </div>
  <nav class="side-nav" id="side-nav"></nav>
</aside>
<div class="mobile-brand">
  <img src="../../assets/branding/codex-remote-logo.svg" alt="">
  <div class="brand-name">Codex Remote</div>
</div>
<main class="content" id="main"></main>
<nav class="bottom-tabs" id="bottom-tabs"></nav>
<div id="modal-root"></div>
<script>
"use strict";

/* ================= 状态 ================= */
const AREAS = [
  ["overview", "总览"],
  ["bots", "机器人"],
  ["backends", "对话后端"],
  ["system", "系统"],
];
const S = {
  area: "overview",
  toast: null,
  loadError: false,
  // 机器人
  bots: [
    { id: "b1", name: "研发助手", appId: "cli_a82f1c9e5b7346d0", plan: "apply_required", conn: "连接正常", enabled: true, verified: "2026-07-30 14:22", runtimePending: false, readOnly: false },
    { id: "b2", name: "运营机器人", appId: "cli_b93e2d7a4c1581ef", plan: "clean", conn: "连接正常", enabled: true, verified: "2026-07-28 09:41", runtimePending: false, readOnly: false },
  ],
  selectedBot: "b1",
  botMobileDetail: false,
  botView: "detail",           // detail | add
  add: { mode: "qr", qr: "idle", appId: "", secret: "", name: "", errs: {}, busy: false, fail: false, retried: false, timer: null },
  planBusy: "",
  publishModal: false, publishBusy: false,
  deleteBotModal: false, deleteBotBusy: false,
  permState: "idle",           // idle | checking | ready | missing | error
  permScenario: "ready",       // ready | missing（hash 场景控制）
  permFailOnce: false,
  // 对话后端
  backendTab: "claude",
  claude: [
    { id: "default", name: "默认", builtIn: true, ctx1m: true, baseURL: "", model: "", smallModel: "", effort: "" },
    { id: "c2", name: "研发代理", builtIn: false, ctx1m: false, baseURL: "https://api.example.com/v1", model: "", smallModel: "", effort: "" },
  ],
  selectedClaude: "default",
  claudeMobileDetail: false,
  claudeEditor: null,          // "new" 或 profile id
  claudeDraft: null,
  claudeBusy: false,
  deleteClaudeModal: false,
  codex: [
    { id: "native", kind: "native", name: "本机默认", editable: false, contextEditable: true, deletable: false, available: true, statusTag: "", baseURL: "", model: "", review: "", effort: "", ctx: "codex_default" },
    { id: "oauth", kind: "oauth", name: "ChatGPT 登录", editable: false, contextEditable: true, deletable: false, available: false, statusTag: "未检测到登录", baseURL: "", model: "", review: "", effort: "", ctx: "codex_default" },
    { id: "cx3", kind: "api", name: "研发代理", editable: true, contextEditable: true, deletable: true, available: true, statusTag: "", baseURL: "https://api.example.com/v1", model: "gpt-5.5", review: "", effort: "high", ctx: "price_guard_272k" },
  ],
  selectedCodex: "cx3",
  codexMobileDetail: false,
  codexEditor: null,
  codexDraft: null,
  codexBusy: false,
  deleteCodexModal: false,
  // 系统
  autostart: "disabled",       // disabled | busy | enabled
  vscode: "needs-fix",         // needs-fix | busy | ready
  storage: {
    preview: { files: 36, mb: 96, busy: false },
    images: { files: 12, mb: 24, busy: false },
    logs: { files: 8, mb: 8, busy: false },
  },
  storageWarn: "",
  // 场景
  conflictOnce: false,
  addFailOnce: false,
  refsOnDelete: false,
  storagePartial: false,
};

/* ================= 场景开关 ================= */
(function initScenario() {
  const m = location.hash.match(/s=([\w-]+)/);
  const s = m ? m[1] : "";
  switch (s) {
    case "all-good":
      S.bots[0].plan = "clean"; S.autostart = "enabled"; S.vscode = "ready";
      S.storage = { preview: { files: 0, mb: 0, busy: false }, images: { files: 0, mb: 0, busy: false }, logs: { files: 0, mb: 0, busy: false } };
      break;
    case "plan-blocked": S.bots[0].plan = "blocked"; break;
    case "plan-degraded": S.bots[0].plan = "degraded"; break;
    case "plan-review": S.bots[0].plan = "publish_required"; break;
    case "runtime-pending": S.bots[0].runtimePending = true; break;
    case "perm-missing": S.permScenario = "missing"; break;
    case "perm-error": S.permFailOnce = true; break;
    case "readonly-bot": S.bots[0].readOnly = true; break;
    case "qr-expired": S.add.qrScenario = "expired"; break;
    case "add-fail": S.addFailOnce = true; break;
    case "conflict": S.conflictOnce = true; break;
    case "refs": S.refsOnDelete = true; break;
    case "storage-partial": S.storagePartial = true; break;
    case "load-error": S.loadError = true; break;
  }
})();
window.addEventListener("hashchange", () => location.reload());

/* ================= 工具 ================= */
function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
let toastSeq = 0;
function showToast(tone, message) {
  const id = ++toastSeq;
  S.toast = { tone, message };
  render();
  if (tone === "good") setTimeout(() => { if (id === toastSeq) { S.toast = null; render(); } }, 4000);
}
function currentBot() { return S.bots.find(b => b.id === S.selectedBot) || null; }
function gotoArea(area) {
  S.area = area;
  window.scrollTo(0, 0);
  render();
}

/* ================= 渲染入口 ================= */
function render() {
  const nav = document.getElementById("side-nav");
  const tabs = document.getElementById("bottom-tabs");
  nav.innerHTML = AREAS.map(([id, name]) =>
    `<button type="button" class="${S.area === id ? "on" : ""}" onclick="gotoArea('${id}')">${name}</button>`).join("");
  tabs.innerHTML = AREAS.map(([id, name]) =>
    `<button type="button" class="${S.area === id ? "on" : ""}" onclick="gotoArea('${id}')">${name}</button>`).join("");

  const main = document.getElementById("main");
  if (S.loadError) {
    main.innerHTML = `<section class="card empty-state">
      <strong>当前页面暂时无法读取状态</strong>

function codexSummary(p) {
  const parts = [KIND_LABEL[p.kind] || "API"];
  if (!p.available && p.statusTag) parts.push(p.statusTag);
  if (p.baseURL) parts.push(p.baseURL);
  if (p.model) parts.push(`模型 ${p.model}`);
  if (p.effort) parts.push(`推理 ${p.effort}`);
  parts.push(CTX_LABEL[p.ctx]);
  return parts.join(" · ");
}

        ${refs.length ? `<div class="notice warn"><strong>这个配置仍在使用中</strong>删除前请确认以下引用可以中断。</div>
          <ul class="ref-list">${refs.map(r => `<li><span class="badge warn">${r.kind}</span><span style="flex:1;">${esc(r.name.trim())}</span><span style="color:var(--text-muted);">${r.reason}</span></li>`).join("")}</ul>` : ""}
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeDeleteCodex()">取消</button>
          <button class="btn btn-danger" onclick="deleteCodex()">确认删除</button>
        </div>
      </div>
    </div>`;
  }
  root.innerHTML = html;
}

/* ================= 假二维码 ================= */
function drawFakeQR(cv) {
  const ctx = cv.getContext("2d");
  const n = 25, cell = 184 / n;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 184, 184);
  ctx.fillStyle = "#112B39";
  let seed = 20260801;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const inFinder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (inFinder(x, y)) continue;
    if (rnd() > 0.52) ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  const finder = (fx, fy) => {
    ctx.fillStyle = "#112B39"; ctx.fillRect(fx * cell, fy * cell, 7 * cell, 7 * cell);
    ctx.fillStyle = "#fff"; ctx.fillRect((fx + 1) * cell, (fy + 1) * cell, 5 * cell, 5 * cell);
    ctx.fillStyle = "#112B39"; ctx.fillRect((fx + 2) * cell, (fy + 2) * cell, 3 * cell, 3 * cell);
  };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
}
